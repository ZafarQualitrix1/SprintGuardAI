name: Docker Build & Push

# Builds and pushes both app images to GitHub Container Registry, tagged by commit SHA
# (Solution Architecture §27: "identical container images promoted across environments").
# Runs only after CI passes on uat/master -- this workflow does not itself deploy anywhere; promoting
# an image tag to staging/production is a manual approval-gated step per the same architecture
# section, left for the target platform's own deploy tooling (K8s/ArgoCD/etc.) to wire up.

on:
  workflow_run:
    workflows: ['CI']
    branches: [uat, master]
    types: [completed]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: api
            dockerfile: apps/api/Dockerfile
            image: sprintguard-api
          - app: web
            dockerfile: apps/web/Dockerfile
            image: sprintguard-web

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.event.workflow_run.head_sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
