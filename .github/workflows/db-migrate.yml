name: DB Migrate

# Promotes Prisma migrations to each environment's own Supabase Postgres project, gated by a
# GitHub Environment per branch (docs/architecture/07-environment-isolation.md §6). This is
# deliberately NOT part of the Vercel build (apps/api/vercel.json only runs `prisma generate`) --
# migrations must run from a controlled runner, once, rather than on every serverless build.
#
# migrate-uat runs unattended on every push to `uat`. migrate-production runs on every push to
# `master` (i.e. after a reviewed uat->master merge) but is held by the `production` GitHub
# Environment's required-reviewer rule -- configure that rule in Settings -> Environments
# (documented in the isolation doc; cannot be set from a workflow file).

on:
  push:
    branches: [uat, master]

concurrency:
  group: db-migrate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate-uat:
    if: github.ref == 'refs/heads/uat'
    runs-on: ubuntu-latest
    environment: uat
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # TEMPORARY diagnostic -- prints only the non-secret parts of DATABASE_URL (host/port/
      # username/path length) to debug a P1013 "empty host" parse error, without ever logging
      # the password. Remove once the secret is confirmed well-formed.
      - name: Debug DATABASE_URL shape (no secrets printed)
        run: |
          node -e "
          const raw = process.env.DATABASE_URL || '';
          console.log('raw length:', raw.length);
          console.log('starts with postgresql://:', raw.startsWith('postgresql://'));
          console.log('first 15 chars (safe prefix only):', JSON.stringify(raw.slice(0, 15)));
          console.log('last 40 chars (safe suffix -- host/port/db, no password there):', JSON.stringify(raw.slice(-40)));
          console.log('count of @ symbols:', (raw.match(/@/g) || []).length);
          console.log('count of : symbols:', (raw.match(/:/g) || []).length);
          console.log('has newline/tab/CR:', /[\n\t\r]/.test(raw));
          console.log('has space:', raw.includes(' '));
          console.log('has literal quote char:', raw.includes('\"') || raw.includes(\"'\"));
          try {
            const u = new URL(raw);
            console.log('protocol:', u.protocol);
            console.log('username:', u.username);
            console.log('host:', u.hostname);
            console.log('port:', u.port);
            console.log('pathname:', u.pathname);
          } catch (e) {
            console.log('URL constructor threw:', e.message);
          }
          "
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Apply pending migrations to SprintGuardAI_UAT
        run: pnpm db:deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  migrate-production:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply the same migrations to SprintGuardAI (production)
        run: pnpm db:deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
